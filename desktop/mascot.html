<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'none'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Gregal</title>
<link rel="stylesheet" href="mascot.css">
</head>
<body>
<div class="mascot-stage" data-mood="idle" data-collapsed="0">
  <button type="button" class="mascot-btn" id="mascot" aria-label="Gregal" title="Gregal">
    <svg class="mascot-svg" viewBox="0 0 64 64" role="img" aria-label="Gregal" focusable="false">
    <g class="v-streaks"><path d="M4 9h11"/><path d="M1 17h8"/><path d="M6 30h9"/></g>
    <g class="v-stand">
    <path class="v-cross" d="M19 48H45M38 43.5L26 52.5"/>
    <path class="v-post" d="M32 21V58"/>
    <path class="v-base" d="M25 62h14l-2.5-4h-9z"/>
    <text class="v-letter" x="13.5" y="48">W</text>
    <text class="v-letter" x="50.5" y="48">E</text>
    <text class="v-letter" x="41.5" y="40.5">N</text>
    <text class="v-letter" x="22.5" y="56">S</text>
    </g>
    <g class="v-arrow">
    <path class="v-shaft" d="M32 35V7"/>
    <path class="v-curl" d="M32 31c4 0 6-2.3 5.6-4.8c-.3-2.1-3.1-2.6-4-.8"/>
    <path class="v-tail" d="M32 31.5l5.2 4.3V41l-5.2-3.2l-5.2 3.2v-5.2z"/>
    <path class="v-head" d="M32 1l5 9.5l-5-2.2l-5 2.2z"/>
    <circle class="v-ring" cx="32" cy="4" r="4"/>
    <path class="v-spark" d="M39 0v3M37.5 1.5h3M24.5 3v2.6M23.2 4.3h2.6"/>
    </g>
    <circle class="v-hub" cx="32" cy="20" r="2.4"/>
    </svg>
  </button>
  <div class="mascot-ctrls" role="toolbar" aria-label="Gregal">
    <button type="button" class="m-ctl" id="mascotCollapse" aria-label="Minimize" title="Minimize"><svg viewBox="0 0 12 12" aria-hidden="true" focusable="false"><path d="M2.5 6h7"/></svg></button>
    <button type="button" class="m-ctl" id="mascotSnap" aria-label="Snap to a corner" title="Snap to a corner"><svg viewBox="0 0 12 12" aria-hidden="true" focusable="false"><path d="M2 7.5V10h2.5M10 4.5V2H7.5"/></svg></button>
    <button type="button" class="m-ctl" id="mascotHide" aria-label="Hide" title="Hide"><svg viewBox="0 0 12 12" aria-hidden="true" focusable="false"><path d="M3 3l6 6M9 3l-6 6"/></svg></button>
  </div>
</div>
<script src="mascot-view.js"></script>
</body>
</html>
