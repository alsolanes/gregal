<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'none'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Gregal</title>
<!-- Pantalla de «no arrenca» (main.js → showStartupError): els colors del
     tema (paràmetres bg, bar, ink, accent i scheme, com loading.html), per
     què (reason: start, stopped o remote), un botó per tornar-ho a provar i
     els detalls del backend (codi de sortida i les últimes línies del log),
     que arriben per IPC i no per la URL. -->
<script>
  (() => {
    const q = new URLSearchParams(location.search);
    const hex = v => /^#[0-9a-fA-F]{6}$/.test(v || '') ? v : '';
    const r = document.documentElement;
    const light = q.get('scheme') === 'light';
    r.dataset.scheme = light ? 'light' : 'dark';
    for (const [k, v] of [['bg', light ? '#F6F7FA' : '#14161B'], ['bar', light ? '#EEF0F5' : '#101217'], ['ink', light ? '#0E1220' : '#F2F4F8'], ['accent', light ? '#4F5BE8' : '#8193FF']]) {
      r.style.setProperty('--' + k, hex(q.get(k)) || v);
    }
    r.lang = q.get('lang') === 'ca' ? 'ca' : 'en';
  })();
</script>
<style>
  :root { --bg:#14161B; --bar:#101217; --ink:#F2F4F8; --accent:#8193FF; color-scheme:dark;
    --muted:color-mix(in srgb, var(--ink) 64%, var(--bg));
    --surface:color-mix(in srgb, var(--ink) 4%, var(--bg));
    --line:color-mix(in srgb, var(--ink) 13%, transparent);
    --code:color-mix(in srgb, var(--ink) 7%, var(--bg)); }
  :root[data-scheme="light"] { color-scheme:light; --surface:color-mix(in srgb, #FFFFFF 70%, var(--bg)); }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); }
  body { font:14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; display:grid; place-items:center; overflow:auto; }
  /* Franja de dalt: fa de barra de títol (arrossegable) sota els botons del sistema. */
  .bar { position:fixed; inset:0 0 auto 0; height:38px; background:var(--bar); -webkit-app-region:drag; }
  .card { box-sizing:border-box; width:min(460px, calc(100vw - 48px)); margin:62px 0 24px; padding:32px 32px 24px;
    background:var(--surface); border:1px solid var(--line); border-radius:14px; text-align:center; }
  .mark { display:block; width:52px; height:52px; margin:0 auto 14px; }
  .mark .gust { fill:var(--accent); }
  .mark .eye { fill:var(--surface); }
  h1 { margin:0 0 8px; font-size:18px; font-weight:650; letter-spacing:-.01em; }
  .desc { margin:0 0 22px; color:var(--muted); }
  .actions { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  button { font:inherit; font-weight:600; border-radius:8px; padding:8px 18px; cursor:pointer; transition:background .15s, border-color .15s, opacity .15s; }
  button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .primary { background:var(--accent); color:var(--bg); border:1px solid var(--accent); min-width:150px; }
  .primary:hover { background:color-mix(in srgb, var(--accent) 86%, var(--ink)); }
  .secondary { background:transparent; color:var(--ink); border:1px solid var(--line); }
  .secondary:hover { border-color:color-mix(in srgb, var(--ink) 30%, transparent); }
  button:disabled { opacity:.6; cursor:progress; }
  .status { min-height:1.5em; margin:12px 0 0; font-size:13px; color:var(--muted); }
  details { margin-top:14px; text-align:left; border-top:1px solid var(--line); padding-top:12px; }
  summary { cursor:pointer; color:var(--muted); font-size:13px; width:max-content; border-radius:4px; }
  summary:hover { color:var(--ink); }
  summary:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .facts { margin:10px 0 8px; color:var(--muted); font-size:13px; }
  pre { margin:0; max-height:180px; overflow:auto; padding:10px 12px; border-radius:8px; background:var(--code); border:1px solid var(--line);
    font:12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space:pre-wrap; word-break:break-word; user-select:text; }
  .hint { margin:10px 0 0; color:var(--muted); font-size:12.5px; }
  code { font:12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; padding:1px 5px; border-radius:4px; background:var(--code); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div class="bar" aria-hidden="true"></div>
<main class="card">
  <svg class="mark" viewBox="0 0 1024 1024" aria-hidden="true" focusable="false">
    <path class="gust" d="M810 100C950 360 900 640 640 795C470 900 240 915 70 880C300 870 490 795 565 705C460 765 340 800 225 810C490 665 535 575 225 510C510 425 770 340 810 100Z"/>
    <ellipse cx="675" cy="530" rx="29" ry="53" transform="rotate(18 675 530)" class="eye"/>
    <ellipse cx="792" cy="518" rx="27" ry="51" transform="rotate(18 792 518)" class="eye"/>
  </svg>
  <h1 id="errTitle">Gregal couldn't start</h1>
  <p class="desc" id="errDesc">The local server that runs Gregal didn't respond. Try again; if it keeps happening, the details below show what went wrong.</p>
  <div class="actions">
    <button type="button" class="primary" id="retryBtn" autofocus>Try again</button>
    <button type="button" class="secondary" id="logBtn" hidden>Show log file</button>
  </div>
  <p class="status" id="status" role="status" aria-live="polite"></p>
  <details id="details" hidden>
    <summary id="detailsSummary">Details</summary>
    <p class="facts" id="facts"></p>
    <pre id="log" hidden></pre>
    <p class="hint" id="hint">To use a Gregal server that's already running, open the app with <code>GREGAL_URL</code> set to its address.</p>
  </details>
</main>
<script>
  (() => {
    const q = new URLSearchParams(location.search);
    const ca = q.get('lang') === 'ca';
    const name = (q.get('name') || 'Gregal').slice(0, 40);
    const reason = ['start', 'stopped', 'remote'].includes(q.get('reason')) ? q.get('reason') : 'start';
    const $ = id => document.getElementById(id);
    const T = ca ? {
      start: ["No s'ha pogut obrir " + name, "El servidor local de " + name + " no ha respost. Torna-ho a provar; si continua passant, als detalls hi ha què ha fallat."],
      stopped: ["El servidor local de " + name + " s'ha aturat", "S'ha tancat de cop. Torna'l a engegar per continuar on eres."],
      remote: ["No es pot connectar amb el servidor", "El servidor de GREGAL_URL no respon. Comprova que estigui en marxa i torna-ho a provar."],
      exited: "El servidor local s'ha tancat mentre arrencava. Als detalls hi ha per què; quan ho hagis arreglat, torna-ho a provar.",
      retry: 'Torna-ho a provar', busy: 'Engegant…', log: 'Mostra el fitxer de log', again: 'Encara no respon.',
      details: 'Detalls', code: 'Codi de sortida', port: 'Port', server: 'Servidor',
      hint: "Per fer servir un servidor de Gregal que ja tens en marxa, obre l'app amb <code>GREGAL_URL</code> apuntant-hi.",
    } : {
      start: [name + " couldn't start", "The local server that runs " + name + " didn't respond. Try again; if it keeps happening, the details below show what went wrong."],
      stopped: [name + "'s local server stopped", 'It closed unexpectedly. Start it again to carry on where you were.'],
      remote: ["Can't reach the Gregal server", "The server set in GREGAL_URL isn't answering. Check that it's running and try again."],
      exited: "The local server closed while it was starting. The details below show why; once that's fixed, try again.",
      retry: 'Try again', busy: 'Starting…', log: 'Show log file', again: 'Still not responding.',
      details: 'Details', code: 'Exit code', port: 'Port', server: 'Server',
      hint: "To use a Gregal server that's already running, open the app with <code>GREGAL_URL</code> set to its address.",
    };
    document.title = name;
    $('errTitle').textContent = T[reason][0];
    $('errDesc').textContent = T[reason][1];
    $('retryBtn').textContent = T.retry;
    $('logBtn').textContent = T.log;
    $('detailsSummary').textContent = T.details;
    $('hint').innerHTML = T.hint;
    $('hint').hidden = reason === 'remote';

    const bridge = window.gregalDesktop || {};
    async function loadDetails() {
      if (typeof bridge.startupError !== 'function') return;
      let info = null;
      try { info = await bridge.startupError(); } catch (e) {}
      if (!info) return;
      const facts = [];
      if (Number.isInteger(info.code)) facts.push(T.code + ': ' + info.code);
      // Ha arrencat i s'ha tancat: no és que «no respongui».
      if (reason === 'start' && Number.isInteger(info.code)) $('errDesc').textContent = T.exited;
      if (info.port) facts.push(T.port + ': ' + info.port);
      if (info.server) facts.push(T.server + ': ' + info.server);
      $('facts').textContent = facts.join(' · ');
      $('facts').hidden = !facts.length;
      const lines = Array.isArray(info.logs) ? info.logs.filter(l => typeof l === 'string' && l.trim()) : [];
      $('log').textContent = lines.join('\n');
      $('log').hidden = !lines.length;
      $('details').hidden = !facts.length && !lines.length && reason === 'remote';
      $('logBtn').hidden = !info.logFile || typeof bridge.openBackendLog !== 'function';
    }
    $('logBtn').addEventListener('click', () => { try { bridge.openBackendLog(); } catch (e) {} });
    $('retryBtn').addEventListener('click', async () => {
      const btn = $('retryBtn');
      btn.disabled = true;
      btn.textContent = T.busy;
      $('status').textContent = '';
      let ok = false;
      try {
        if (typeof bridge.retryBackend === 'function') ok = !!(await bridge.retryBackend())?.ok;
        else { location.reload(); return; }
      } catch (e) {}
      if (ok) return; // El procés principal ja carrega l'app.
      btn.disabled = false;
      btn.textContent = T.retry;
      $('status').textContent = T.again;
      await loadDetails();
    });
    loadDetails();
  })();
</script>
</body>
</html>
