<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gregal - Server offline</title>
<style>
  :root {
    --bg: #13151B;
    --surface: #1A1D25;
    --surface-hi: #242833;
    --ink: #F3F5FA;
    --text: #E4E7EF;
    --muted: #A3AABA;
    --escuma: #8193FF;
    --escuma-clara: #A3B0FF;
    --abisme: #0E1015;
    --line: rgba(201,209,230,.16);
  }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    height: 100vh;
    margin: 0;
    align-items: center;
    justify-content: center;
  }
  .card {
    text-align: center;
    max-width: 440px;
    padding: 36px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: 0 24px 70px rgba(0,0,0,.45);
  }
  .mark {
    display: block;
    width: 64px;
    height: 64px;
    margin: 0 auto 8px;
    user-select: none;
  }
  .mark .gust { fill: var(--escuma); }
  .mark .eye { fill: var(--bg); }
  h2 {
    margin: 12px 0;
    color: var(--ink);
    font-size: 20px;
  }
  p {
    color: var(--muted);
    line-height: 1.5;
    margin: 12px 0 20px;
  }
  code {
    background: var(--abisme);
    padding: 2px 8px;
    border-radius: 6px;
    color: var(--escuma);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 14px;
  }
  button {
    background: var(--escuma);
    color: var(--bg);
    border: 0;
    border-radius: 8px;
    padding: 10px 28px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: background .15s ease;
  }
  button:focus-visible {
    outline: 2px solid var(--escuma-clara);
    outline-offset: 2px;
  }
  button:hover {
    background: var(--escuma-clara);
  }
  button:disabled {
    opacity: .5;
    cursor: wait;
  }
</style>
</head>
<body>
<div class="card">
  <svg class="mark" viewBox="0 0 1024 1024" aria-hidden="true" focusable="false">
    <path class="gust" d="M810 100C950 360 900 640 640 795C470 900 240 915 70 880C300 870 490 795 565 705C460 765 340 800 225 810C490 665 535 575 225 510C510 425 770 340 810 100Z"/>
    <ellipse cx="675" cy="530" rx="29" ry="53" transform="rotate(18 675 530)" class="eye"/>
    <ellipse cx="792" cy="518" rx="27" ry="51" transform="rotate(18 792 518)" class="eye"/>
  </svg>
  <h2 id="errTitle">Could not start Gregal</h2>
  <p id="errDesc">The app could not start the local backend. Try again or launch with
  <code>GREGAL_URL</code> to connect to an existing server.</p>
  <button id="retryBtn" onclick="doRetry()">Try again</button>
</div>
<script>
  const isEn = new URLSearchParams(location.search).get('lang') !== 'ca';
  document.documentElement.lang = isEn ? 'en' : 'ca';
  if (!isEn) {
    document.title = 'Gregal - Sense servidor';
    document.getElementById('errTitle').textContent = "No s'ha pogut iniciar Gregal";
    document.getElementById('errDesc').innerHTML = "L'app no ha pogut arrencar el backend local. Torna-ho a provar o inicia-la amb <code>GREGAL_URL</code> per connectar-te a un servidor existent.";
    document.getElementById('retryBtn').textContent = 'Torna-ho a provar';
  }
  async function doRetry() {
    const btn = document.getElementById('retryBtn');
    if (btn) {
      btn.disabled = true;
      btn.textContent = isEn ? 'Connecting…' : 'Connectant…';
    }
    try {
      if (window.gregalDesktop && window.gregalDesktop.retryBackend) {
        const res = await window.gregalDesktop.retryBackend();
        if (res && res.ok) return;
      }
    } catch (e) {}
    location.reload();
  }
</script>
</body>
</html>
