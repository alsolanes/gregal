name: Bug report
description: Report a reproducible problem using synthetic data.
body:
  - type: markdown
    attributes:
      value: |
        Do not include tokens, private documents, personal paths or conversation history.
        Report vulnerabilities privately using SECURITY.md, not this form.
  - type: input
    id: version
    attributes:
      label: Version and platform
      placeholder: Commit or release, operating system, interface
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use a minimal example with synthetic inputs.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      description: Remove credentials, private paths and identifiers before submitting.
