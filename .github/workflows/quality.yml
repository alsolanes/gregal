name: Quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: node scripts/audit-public.cjs .
      - run: python -m pip install -e ./python
      - run: python -m unittest discover -s python/tests
      - run: node --test scripts/audit-public.test.cjs
      - run: node scripts/verify-vendor.cjs
      - run: go test ./...
      - run: go vet ./...
      - name: Race detection on Linux
        if: runner.os == 'Linux'
        run: go test -race ./...
      - run: npm ci
        working-directory: desktop
      - run: node --experimental-vm-modules --test internal/web/*.test.js internal/web/app/*.test.cjs desktop/*.test.js scripts/*.test.cjs
  vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-gregal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run compile
      - run: npm test
      - run: npm audit --audit-level=high
  desktop:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run backend
      - run: npx electron-builder --dir
