# The only release pipeline (see docs/release.md). Pushing a vX.Y.Z tag
# builds every asset and creates ONE draft release with the notes from
# CHANGELOG.md; you review it and publish. The Android APK is attached
# locally afterwards with `node scripts/release.cjs apk X.Y.Z`.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Versions, changelog and tag agree
        id: v
        run: |
          node scripts/release.cjs check
          version=$(node -p "require('./desktop/package.json').version")
          if [ "$GITHUB_REF" != "refs/tags/v$version" ]; then
            echo "Release must run on the tag v$version (got $GITHUB_REF)" >&2
            exit 1
          fi
          node scripts/release.cjs notes "$version" > /dev/null
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: node scripts/audit-public.cjs

  windows:
    needs: verify
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: go test ./...
      - run: go vet ./...
      - run: npm ci
        working-directory: desktop
      - run: node --experimental-vm-modules --test internal/web/*.test.js internal/web/app/*.test.cjs desktop/*.test.js scripts/*.test.cjs
      - run: node node_modules/electron/install.js
        working-directory: desktop
      - run: npm audit --audit-level=high
        working-directory: desktop
      - name: Build installer, portable and update metadata
        run: npm run dist-win -- --config.directories.output=../output/release
        working-directory: desktop
      - name: Verify update metadata
        run: node desktop/verify-release.js output/release
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            output/release/*.exe
            output/release/latest.yml
            output/release/*.blockmap

  cli:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sh ./build.sh "v${{ needs.verify.outputs.version }}"
      - run: sha256sum --check SHA256SUMS
        working-directory: dist
      - uses: actions/upload-artifact@v4
        with:
          name: cli
          path: dist/gregal-*

  vscode:
    needs: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-gregal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: vscode
          path: vscode-gregal/*.vsix

  release:
    needs: [verify, windows, cli, vscode]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: One checksum file for every asset
        working-directory: assets
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create the draft release
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "Release v$VERSION already exists; published update assets are never replaced." >&2
            exit 1
          fi
          node scripts/release.cjs notes "$VERSION" > notes.md
          gh release create "v$VERSION" assets/* --verify-tag --draft \
            --title "$(node scripts/release.cjs title "$VERSION")" --notes-file notes.md
