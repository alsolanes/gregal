# Gregal Jocs, ready for any server with Docker.
#   ./deploy.sh                  (service only, at http://SERVER:8197)
#   ./deploy.sh --domain jocs.example.com   (+ automatic HTTPS with Caddy)
name: gregal-jocs
services:
  jocs:
    build:
      context: ../..
      dockerfile: deploy/jocs/Dockerfile
      args:
        VERSION: ${VERSION:-dev}
    image: gregal-jocs:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      - jocs-data:/data
    ports:
      # With Caddy (https profile) it is only exposed on loopback.
      - "${JOCS_BIND:-0.0.0.0}:${JOCS_PORT:-8197}:8197"

  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    depends_on: [jocs]
    environment:
      JOCS_DOMAIN: ${JOCS_DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    ports:
      - "80:80"
      - "443:443"

volumes:
  jocs-data:
  caddy-data:
