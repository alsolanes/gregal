<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Gregal</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header>
    <img src="icons/icon32.png" alt="">
    <label class="wind-pick"><select id="wind" title=""></select></label>
    <button id="control-live" class="live" type="button" hidden><span class="dot"></span><span id="control-text"></span></button>
    <button id="settings-btn" class="icon" type="button" title="">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
    </button>
  </header>

  <main id="chat">
    <div id="log">
      <section id="hello" class="hello">
        <h1 data-t="hello"></h1>
        <p data-t="helloSub"></p>
        <div id="quick" class="quick"></div>
      </section>
    </div>
    <form id="form">
      <div id="context" class="context"></div>
      <div class="compose">
        <textarea id="input" rows="1"></textarea>
        <button id="send" class="send" type="submit" title="">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>
    </form>
  </main>

  <div id="settings" class="sheet" hidden>
    <div class="sheet-card">
      <div class="sheet-head"><h2 data-t="connect"></h2><button id="settings-close" class="icon" type="button">✕</button></div>
      <div class="switch">
        <button id="mode-desktop" type="button" data-t="modeDesktop"></button>
        <button id="mode-server" type="button" data-t="modeServer"></button>
      </div>
      <p id="desktop-help" class="help" data-t="desktopHelp"></p>
      <div id="server-fields">
        <p class="help" data-t="connectHelp"></p>
        <label><span data-t="address"></span><input id="addr" placeholder="192.168.1.62"></label>
        <label><span data-t="port"></span><input id="port" placeholder="8097"></label>
        <label><span data-t="key"></span><input id="key" type="password" autocomplete="off"></label>
      </div>
      <div class="row"><button id="save" class="primary" type="button" data-t="save"></button><span id="status" class="help"></span></div>
      <hr>
      <label class="toggle">
        <span><b data-t="controlOn"></b><small data-t="controlHelp"></small></span>
        <input id="control" type="checkbox">
      </label>
    </div>
  </div>
  <div id="toast" hidden></div>
  <script type="module" src="panel.js"></script>
</body>
</html>
