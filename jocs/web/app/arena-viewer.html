<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gregal Arena</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1020; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  canvas { width: 100%; height: 100%; display: block; touch-action: manipulation; }
  /* La barra de controls va a baix, sobre el partit, i s'amaga sola: no tapa mai els marcadors de dalt. */
  #stage .ar-scrub.sc-overlay { left: max(8px, env(safe-area-inset-left)); right: max(8px, env(safe-area-inset-right)); bottom: max(8px, env(safe-area-inset-bottom)); }
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>
<script type="module">
// Un partit de l'Arena, sol (mòbil): #id=<partit>&token=<clau>&lang=ca.
// El token va al fragment: no s'envia mai al servidor ni queda als logs.
// Els controls (pausa, velocitat, salt, progrés) són la barra de baix de
// arena-scrubber.js, que s'amaga sola i torna en tocar o moure el ratolí.
import { makeView } from './arena-views.js';
import { mountScrubber } from './arena-scrubber.js';
const q = new URLSearchParams(location.hash.slice(1));
const headers = q.get('token') ? { Authorization: 'Bearer ' + q.get('token') } : {};
const id = q.get('id') || '';
const fetchMatch = after => fetch('/api/arena/match?id=' + encodeURIComponent(id) + '&after=' + after, { headers }).then(r => r.json());
const first = await fetchMatch(0);
const view = await makeView(first.game, document.getElementById('cv'), { lang: 'en', fetchMatch });
window.gregalArenaView = view;
const bar = mountScrubber(document.getElementById('stage'), { overlay: true, autoHide: 2600, keys: true });
bar.setView(view);
window.gregalArenaBar = bar;
</script>
</body>
</html>
