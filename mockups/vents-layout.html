<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vents · propostes de distribució i estètica</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.5 "Segoe UI Variable","Segoe UI",Inter,system-ui,sans-serif;background:#0b0c0e;color:#e7e8ea}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.bar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:14px 22px;align-items:center;padding:12px 20px;background:#111215;border-bottom:1px solid #24262b}
.bar h1{font-size:15px;font-weight:600;margin-right:8px}
.grp{display:flex;align-items:center;gap:6px}
.grp>span{font-size:12px;color:#8b8e96;margin-right:2px}
.seg{display:flex;background:#1b1d21;border-radius:9px;padding:3px}
.seg button{padding:5px 11px;border-radius:7px;font-size:12.5px;color:#a9acb3;white-space:nowrap}
.seg button[aria-pressed=true]{background:#2c2f36;color:#fff}
.seg button .star{color:#f5c451}
.wrap{display:flex;gap:22px;padding:22px;align-items:flex-start}
.stage{flex:1;min-width:0;display:flex;justify-content:center}
.notes{width:330px;flex:none;background:#131417;border:1px solid #24262b;border-radius:14px;padding:18px 18px 20px;font-size:13px;color:#c9cbd0;position:sticky;top:78px}
.notes h2{font-size:16px;color:#fff;margin-bottom:2px}
.notes .tag{font-size:12px;color:#8b8e96;margin-bottom:12px}
.notes h3{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:#7e818a;margin:14px 0 6px;font-weight:600}
.notes ul{padding-left:16px}.notes li{margin:3px 0}
.notes .pro li::marker{color:#6fcf97}.notes .con li::marker{color:#f19a86}
.notes .verdict{margin-top:14px;padding:10px 12px;border-radius:10px;background:#1c1d22;font-size:12.5px}

/* temes */
.frame{--bg:#141518;--side:#17181c;--sf:#1d1f24;--sf2:#24262c;--bd:#2a2d33;--tx:#eceef1;--mu:#9a9da5;--fa:#6c6f77;--ac:#aab4ff;--acbg:#262a44;--ok:#6fcf97;--wa:#f2c46d;--voice:inherit;
 background:var(--bg);color:var(--tx);border-radius:14px;overflow:hidden;border:1px solid #2a2c31;position:relative;flex:none}
.frame.light{--bg:#f7f5f0;--side:#efece5;--sf:#fffdf9;--sf2:#f3f0e9;--bd:#e2ddd2;--tx:#1d1c1a;--mu:#6c675e;--fa:#9a958a;--ac:#4b4fc9;--acbg:#e7e6fb;--ok:#2f8a57;--wa:#a86b00;border-color:#d8d3c8}
.frame.serif .greet,.frame.serif .ans,.frame.serif .pf h2{font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif}
.frame.serif .ans{font-size:15.5px;line-height:1.65}
.frame.serif .greet{font-weight:400;letter-spacing:-.01em}
.desk{width:1240px;height:780px;display:flex}
.mob{width:390px;height:820px;display:flex;flex-direction:column;border-radius:34px;border:8px solid #2a2c31}
.frame.light.mob{border-color:#cfcabf}

/* comuns */
.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.face{--s:24px;width:var(--s);height:var(--s);border-radius:50%;background:var(--c);position:relative;display:inline-block;flex:none}
.face i{position:absolute;left:31%;top:40%;width:calc(var(--s)*.11);height:calc(var(--s)*.13);border-radius:50%;background:#2a2119;box-shadow:calc(var(--s)*.27) 0 0 #2a2119}
.face::after{content:"";position:absolute;left:37%;top:56%;width:26%;height:12%;border:calc(var(--s)*.05) solid #2a2119;border-top:0;border-radius:0 0 99px 99px;box-sizing:border-box}
.face.busy{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--ac)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.sp{flex:1}
.mu{color:var(--mu)}.fa{color:var(--fa)}
.ib{width:32px;height:32px;border-radius:8px;display:inline-grid;place-items:center;color:var(--mu)}
.ib:hover{background:var(--sf2)}
kbd{font-family:inherit;font-size:11px;color:var(--fa);border:1px solid var(--bd);border-radius:5px;padding:0 5px}
.badge{font-size:11px;font-weight:600;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--ac);color:var(--bg);display:inline-grid;place-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:99px;border:1px solid var(--bd);color:var(--mu);font-size:12.5px;white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 13px;border-radius:9px;border:1px solid var(--bd);font-size:13px;white-space:nowrap}
.btn.pri{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.sec{font-size:11.5px;color:var(--fa);padding:14px 10px 4px;display:flex;align-items:center}

/* barra lateral */
.side{width:264px;flex:none;background:var(--side);border-right:1px solid var(--bd);display:flex;flex-direction:column;padding:10px 8px;gap:1px;overflow:hidden}
.brand{display:flex;align-items:center;gap:8px;padding:4px 6px 10px;font-weight:600}
.logo{width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,#8f9bff,#6a5cf0)}
.brand .sw{display:flex;align-items:center;gap:4px;padding:3px 6px;border-radius:7px}
.brand .sw:hover{background:var(--sf2)}
.newbtn{display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;border-radius:10px;border:1px solid var(--bd);background:var(--sf);margin-bottom:6px;font-weight:500}
.ni{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:8px;color:var(--tx);font-size:13.5px;white-space:nowrap;overflow:hidden}
.ni .ic{color:var(--mu)}
.ni:hover{background:var(--sf2)}
.ni.on{background:var(--sf2)}
.ni .t{overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.ni.th{height:32px;font-size:13px;color:var(--mu)}
.ni.th.on{color:var(--tx)}
.strip{display:flex;gap:6px;padding:4px 10px 2px;align-items:center}
.strip .more{width:26px;height:26px;border-radius:50%;border:1px dashed var(--bd);display:grid;place-items:center;color:var(--mu);font-size:11px}
.acct{margin-top:auto;border-top:1px solid var(--bd);padding:10px 6px 2px;display:flex;align-items:center;gap:10px}
.av{width:30px;height:30px;border-radius:50%;background:var(--acbg);color:var(--ac);display:grid;place-items:center;font-weight:600;font-size:13px}

/* principal */
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.top{height:52px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid transparent}
.top.line{border-bottom-color:var(--bd)}
.top .ti{display:flex;align-items:center;gap:8px;font-size:13.5px}
.scroll{flex:1;overflow:hidden;position:relative}
.home{max-width:720px;margin:0 auto;padding:70px 24px 0;display:flex;flex-direction:column;align-items:center}
.faces{display:flex;gap:18px;margin-bottom:22px}
.faces .f{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--mu)}
.faces .add{width:40px;height:40px;border-radius:50%;border:1px dashed var(--bd);display:grid;place-items:center;color:var(--mu)}
.greet{font-size:38px;font-weight:600;letter-spacing:-.02em;margin-bottom:22px;text-align:center}
.composer{width:100%;background:var(--sf);border:1px solid var(--bd);border-radius:22px;padding:14px 14px 10px}
.composer .ph{color:var(--fa);font-size:15px;padding:2px 4px 14px}
.crow{display:flex;align-items:center;gap:6px}
.voice{width:36px;height:36px;border-radius:50%;background:var(--tx);color:var(--bg);display:grid;place-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.chips .pill{height:32px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;margin-top:34px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:13px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card .k{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--fa)}
.card b{font-weight:600;font-size:13.5px}
.card .s{font-size:12.5px;color:var(--mu)}
.card.need{border-color:color-mix(in srgb,var(--wa) 45%,var(--bd))}
.card.need .k{color:var(--wa)}
.prog{height:4px;border-radius:2px;background:var(--sf2);overflow:hidden}.prog i{display:block;height:100%;background:var(--ac);border-radius:2px}
.lbl{font-size:12px;color:var(--fa);margin:26px 0 8px;width:100%;display:flex;align-items:center}
.rows{width:100%}
.row{display:flex;align-items:center;gap:12px;padding:9px 8px;border-radius:10px}
.row:hover{background:var(--sf2)}
.row .tt{font-size:13.5px;font-weight:500}
.row .ss{font-size:12px;color:var(--fa)}
.row .x{flex:1;min-width:0}
.row .x>*{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* conversa */
.thread{max-width:740px;margin:0 auto;padding:26px 28px 140px;display:flex;flex-direction:column;gap:18px}
.ub{align-self:flex-end;max-width:78%;background:var(--sf2);border-radius:18px 18px 6px 18px;padding:10px 14px}
.who{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.steps{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--fa);font-weight:400;margin-left:4px}
.ans{font-size:14.5px;line-height:1.65}
.ans h4{font-size:14.5px;margin:12px 0 4px}
.ans ul{padding-left:20px}.ans li{margin:2px 0}
.src{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.src .pill{height:26px;font-size:12px}
.fav{width:14px;height:14px;border-radius:4px;background:var(--sf2);border:1px solid var(--bd)}
.art{display:flex;align-items:center;gap:12px;border:1px solid var(--bd);background:var(--sf);border-radius:14px;padding:12px;margin-top:12px}
.art .th{width:64px;height:44px;border-radius:8px;background:linear-gradient(160deg,#e8cf98,#8fd6c2);flex:none}
.ask{border:1px solid color-mix(in srgb,var(--wa) 45%,var(--bd));border-radius:14px;padding:12px 14px;margin-top:12px;display:flex;align-items:center;gap:12px;background:color-mix(in srgb,var(--wa) 6%,var(--sf))}
.peer{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;color:var(--mu);border-left:2px solid var(--c);padding:2px 0 2px 10px;margin-top:12px}
.acts{display:flex;gap:2px;margin-top:6px;color:var(--fa)}
.acts .ib{width:28px;height:28px}
.dock{position:absolute;left:0;right:0;bottom:0;padding:0 28px 18px;background:linear-gradient(transparent,var(--bg) 30%)}
.dock .composer{max-width:740px;margin:0 auto;border-radius:20px}
.panel{width:430px;flex:none;border-left:1px solid var(--bd);background:var(--side);display:flex;flex-direction:column}
.browser{margin:12px;border-radius:12px;border:1px solid var(--bd);overflow:hidden;flex:1;display:flex;flex-direction:column;background:#fbf8f1;color:#2a2620}
.browser .url{height:34px;background:var(--sf2);color:var(--mu);display:flex;align-items:center;gap:8px;padding:0 10px;font-size:12px}
.site{padding:22px;flex:1;display:flex;flex-direction:column;gap:12px}
.site .hero{height:120px;border-radius:12px;background:linear-gradient(160deg,#e8cf98,#8fd6c2)}
.site b{font-size:20px;font-family:Georgia,serif}
.site .ln{height:8px;border-radius:4px;background:#e6e0d3}
.site .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.site .grid div{height:70px;border-radius:10px;background:#efe9dc}

/* missatgeria (B) */
.rail{width:64px;flex:none;background:var(--side);border-right:1px solid var(--bd);display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 0}
.rail .r{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--mu);position:relative}
.rail .r.on{background:var(--sf2);color:var(--tx)}
.rail .r .badge{position:absolute;top:2px;right:0}
.list{width:320px;flex:none;border-right:1px solid var(--bd);display:flex;flex-direction:column}
.list .hd{padding:14px 14px 8px;display:flex;align-items:center;gap:8px}
.list .hd b{font-size:18px}
.search{margin:0 12px 8px;height:36px;border-radius:10px;background:var(--sf2);display:flex;align-items:center;gap:8px;padding:0 10px;color:var(--fa);font-size:13px}
.filters{display:flex;gap:6px;padding:0 12px 8px}
.filters .pill{height:26px;font-size:12px}
.filters .pill.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.ci{display:flex;gap:11px;padding:10px 12px;align-items:center}
.ci.on{background:var(--sf2)}
.ci .x{flex:1;min-width:0}
.ci .l1{display:flex;align-items:baseline;gap:6px}.ci .l1 b{font-size:14px;font-weight:600}.ci .l1 small{margin-left:auto;font-size:11.5px;color:var(--fa)}
.ci .l2{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--mu)}.ci .l2 span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci .l2 .typ{color:var(--ac)}.ci .l2 .badge{flex:none}
.grpf{position:relative;width:44px;height:44px;flex:none}.grpf>.face{position:absolute}
.prof{width:300px;flex:none;border-left:1px solid var(--bd);background:var(--side);padding:24px 18px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.prof .sect{width:100%;text-align:left;margin-top:12px}
.prof .sect .k{font-size:11.5px;color:var(--fa);margin-bottom:6px}
.mem{font-size:12.5px;padding:7px 10px;border-radius:9px;background:var(--sf);border:1px solid var(--bd);margin-bottom:6px}

/* feina i perfil */
.page{max-width:860px;margin:0 auto;padding:30px 32px 40px}
.page h1{font-size:24px;font-weight:600;margin-bottom:4px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--bd);margin:16px 0 4px}
.tabs>span{padding:8px 12px;font-size:13px;color:var(--mu);border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:6px;align-items:center;white-space:nowrap}
.tabs>span.on{color:var(--tx);border-color:var(--tx)}
.box{border:1px solid var(--bd);border-radius:14px;background:var(--sf);overflow:hidden}
.box .row{border-radius:0;border-bottom:1px solid var(--bd);padding:12px 14px}
.box .row:last-child{border-bottom:0}
.st{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--sf2);color:var(--mu);white-space:nowrap}
.st.ok{color:var(--ok)}
.pf{display:flex;gap:18px;align-items:center}
.pf h2{font-size:26px;font-weight:600}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}

/* mòbil */
.sbar{height:34px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:12.5px;font-weight:600}
.mtop{height:48px;flex:none;display:flex;align-items:center;gap:6px;padding:0 8px}
.mtop .c{flex:1;display:flex;justify-content:center;align-items:center;gap:6px;font-weight:600;font-size:15px}
.mbody{flex:1;overflow:hidden;position:relative;display:flex;flex-direction:column}
.tabbar{height:64px;flex:none;border-top:1px solid var(--bd);display:flex;background:var(--side);padding-bottom:6px}
.tabbar span{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--fa);position:relative}
.tabbar span.on{color:var(--tx)}
.tabbar span.on .ic{stroke-width:2.3}
.tabbar .badge{position:absolute;top:6px;left:calc(50% + 4px);height:16px;min-width:16px;font-size:10px}
.mob .greet{font-size:30px;margin-bottom:12px}
.mob .composer{border-radius:24px;padding:10px 10px 8px}
.mob .composer .ph{padding:2px 6px 10px;font-size:15px}
.mdock{padding:8px 12px 10px;flex:none}
.hs{display:flex;gap:10px;overflow:hidden;padding:0 16px}
.hs .card{width:230px;flex:none}
.mob .thread{padding:14px 16px 20px;gap:14px}
.mob .page{padding:12px 16px}
.mob .page h1{font-size:22px}
.fab{position:absolute;right:16px;bottom:16px;width:54px;height:54px;border-radius:17px;background:var(--tx);color:var(--bg);display:grid;place-items:center}
.handle{width:120px;height:4px;border-radius:2px;background:var(--fa);margin:6px auto 4px;opacity:.6}
.cap{font-size:12px;color:#8b8e96;text-align:center;margin-top:10px}

/* avatars */
.wav{--s:24px;width:var(--s);height:var(--s);display:inline-block;flex:none;border-radius:50%;position:relative}
.wav.sq{border-radius:30%}
.wav svg{display:block;width:100%;height:100%}
.wav.busy{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--ac)}
.swing{transform-box:view-box;transform-origin:50% 50%;animation:swing 1.6s ease-in-out infinite}
@keyframes swing{0%,100%{transform:rotate(-16deg)}50%{transform:rotate(16deg)}}
.flow path{stroke-dasharray:24 9;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-33}}
.spb{position:absolute;right:-3px;bottom:-3px;width:calc(var(--s)*.42);height:calc(var(--s)*.42);border-radius:50%;background:var(--bg);display:grid;place-items:center;color:color-mix(in srgb,var(--c) 55%,var(--tx));box-shadow:0 0 0 1px var(--bd)}
.tag{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:6px;font-size:11.5px;font-weight:500;white-space:nowrap;flex:none;background:color-mix(in srgb,var(--c) 18%,transparent);color:color-mix(in srgb,var(--c) 50%,var(--tx))}
.tag .ic{stroke-width:2.2}
.faces .f small{font-size:11px;color:var(--fa);margin-top:-4px}
.filters{overflow:hidden;white-space:nowrap}
.divi{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--fa)}
.divi::before,.divi::after{content:"";flex:1;height:1px;background:var(--bd)}
.tbl{width:100%;border-collapse:collapse;font-size:13px;margin:10px 0 4px}
.tbl th{text-align:left;font-weight:500;color:var(--fa);font-size:12px;padding:6px 8px;border-bottom:1px solid var(--bd)}
.tbl td{padding:7px 8px;border-bottom:1px solid var(--bd)}
.working{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mu)}
.desk.auto{height:auto}
.cmp{display:grid;grid-template-columns:180px 1fr 250px 80px;gap:0;border:1px solid var(--bd);border-radius:14px;overflow:hidden;background:var(--sf)}
.cmp>div{padding:14px 16px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.cmp>div.h{font-size:11.5px;color:var(--fa);padding:8px 16px}
.cmp>div.on{background:color-mix(in srgb,var(--ac) 8%,var(--sf))}
.cmp .nm b{display:block;font-size:14px}.cmp .nm span{font-size:12px;color:var(--mu);line-height:1.35}
.cell{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:var(--mu)}
.sheet{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:8px}
.sheet .card{align-items:flex-start}
.sheet .card .k{margin-bottom:6px}
</style>
</head>
<body>
<div class="bar">
  <h1>Vents · propostes</h1>
  <div class="grp"><span>Distribució</span><div class="seg" id="opt"></div></div>
  <div class="grp"><span>Pantalla</span><div class="seg" id="screen"></div></div>
  <div class="grp"><span>Dispositiu</span><div class="seg" id="device"></div></div>
  <div class="grp"><span>Avatar</span><div class="seg" id="avatar"></div></div>
  <div class="grp"><span>Estil</span><div class="seg" id="theme"></div><div class="seg" id="voice"></div></div>
</div>
<div class="wrap">
  <div class="stage"><div id="fit"><div id="frame"></div><p class="cap" id="cap"></p></div></div>
  <aside class="notes" id="notes"></aside>
</div>
<script>
const S={opt:'E',screen:'dm',device:'desk',theme:'dark',voice:'sans',avatar:'rosa'};
const OPTS=[['E','★ Inici + xat de vents'],['D','D · Inici + Avui'],['A','A · Assistent'],['B','B · Missatgeria'],['C','C · Avui primer']];
const SCREENS=[['home','Inici'],['dm','Xat amb un vent'],['chat','Conversa'],['work','Feina'],['wind','Perfil'],['avatars','Avatars']];
const AVATARS=[['rosa','★ Rosa dels vents'],['cares','Cares (ara)'],['penell','Penell'],['trac','Traç']];
const DEVICES=[['desk','Escriptori'],['mob','Mòbil']];
const THEMES=[['dark','Fosc'],['light','Clar paper']];
const VOICES=[['sans','Veu sans'],['serif','Veu serif']];

const P={
 plus:'<path d="M12 5v14M5 12h14"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',

function seg(id,items,key){const el=document.getElementById(id);el.innerHTML=items.map(([v,t])=>`<button data-v="${v}" aria-pressed="${S[key]===v}">${t.replace('★','<span class="star">★</span>')}</button>`).join('');el.onclick=e=>{const b=e.target.closest('button');if(!b)return;S[key]=b.dataset.v;render();};}
function fit(){const f=document.getElementById('fit');const fr=document.getElementById('frame').firstElementChild;if(!fr)return;f.style.zoom=1;const avail=f.parentElement.clientWidth;const w=fr.offsetWidth;f.style.zoom=Math.min(1,avail/w);}
function render(){
 const screens=SCREENS.filter(([v])=>v!=='dm'||S.opt==='E'||S.opt==='B');
 if(!screens.some(([v])=>v===S.screen))S.screen='home';
 seg('opt',OPTS,'opt');seg('screen',screens,'screen');seg('device',DEVICES,'device');seg('avatar',AVATARS,'avatar');seg('theme',THEMES,'theme');seg('voice',VOICES,'voice');
 const sheet=S.screen==='avatars',dev=sheet?'desk':S.device;
 const cls=['frame',dev,sheet?'auto':'',S.theme==='light'?'light':'',S.voice==='serif'?'serif':''].join(' ');
 document.getElementById('frame').innerHTML=`<div class="${cls}">${dev==='desk'?desk():mob()}</div>`;
 const n=NOTES[S.opt];
 document.getElementById('cap').textContent=sheet?'Sistema d\'avatars · escriptori':`${OPTS.find(x=>x[0]===S.opt)[1]} · ${SCREENS.find(x=>x[0]===S.screen)[1]} · ${S.device==='desk'?'escriptori 1240×780':'mòbil 390×820'}`;
 if(sheet){document.getElementById('notes').innerHTML=NOTES_AV;requestAnimationFrame(fit);return;}
 document.getElementById('notes').innerHTML=`<h2>${n.t}</h2><div class="tag">${n.g}</div>
 <h3>Com ho fan els grans</h3><ul>${n.ins.map(x=>`<li>${x}</li>`).join('')}</ul>
 <h3>A favor</h3><ul class="pro">${n.pro.map(x=>`<li>${x}</li>`).join('')}</ul>
 <h3>En contra</h3><ul class="con">${n.con.map(x=>`<li>${x}</li>`).join('')}</ul>
 ${n.diff?`<h3>Què canvia respecte d'ara</h3><ul>${n.diff.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}`;
 requestAnimationFrame(fit);
}
addEventListener('resize',fit);
render();
