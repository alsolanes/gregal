<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gregal Arena · CS2 live</title>
<style>
  html, body { margin: 0; height: 100%; background: #070a10; overflow: hidden; color: #e8edf6; font: 14px "Segoe UI", system-ui, sans-serif; }
  canvas { width: 100%; height: 100%; display: block; cursor: crosshair; }
  .ov { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(4,6,10,.72); z-index: 5; }
  .ov[hidden] { display: none; }
  .card { background: #111724; border: 1px solid #27324a; border-radius: 14px; padding: 20px 22px; width: min(900px, 94vw); max-height: 92vh; overflow: auto; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  h1 { margin: 0 0 4px; font-size: 22px; } h2 { margin: 16px 0 8px; font-size: 15px; color: #9fb0cc; text-transform: uppercase; letter-spacing: .06em; }
  p.sub { margin: 0 0 12px; color: #9fb0cc; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 6px 0; }
  label { color: #c5d0e3; }
  select, input[type=text], input:not([type]) { background: #0b101b; color: #e8edf6; border: 1px solid #2b3852; border-radius: 8px; padding: 6px 8px; font: inherit; }
  button { background: #1d2740; color: #e8edf6; border: 1px solid #33425f; border-radius: 9px; padding: 7px 12px; font: 600 13px inherit; cursor: pointer; }
  button:hover { background: #26345a; } button:disabled { opacity: .5; cursor: default; }
  button.primary { background: #ffd34d; color: #111; border-color: #ffd34d; font-size: 15px; padding: 10px 20px; }
  .slots { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .slot { border: 1px solid #2b3852; border-radius: 10px; padding: 8px; background: #0d1320; }
  .slot.me { border-color: #ffd34d; box-shadow: 0 0 0 1px #ffd34d inset; }
  .slot b { display: block; font-size: 13px; } .slot small { color: #8797b3; }
  .slot select, .slot input { width: 100%; box-sizing: border-box; margin-top: 6px; font-size: 12px; }
  .keys { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 4px 14px; color: #9fb0cc; font-size: 12.5px; }
  kbd { background: #222c42; border: 1px solid #3a4867; border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; font: 600 11.5px inherit; color: #fff; }
  .muted { color: #8797b3; font-size: 12.5px; }
  .err { color: #ff7b72; }
  #buy .card { width: min(820px, 94vw); }
  .buygrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .buygrid h3 { margin: 0 0 6px; font-size: 12px; color: #8797b3; text-transform: uppercase; }
  .buygrid button { display: flex; justify-content: space-between; width: 100%; margin-bottom: 6px; font-weight: 600; }
  .buygrid button.own { border-color: #4dff6a; }
  .buygrid button span { color: #7fe39a; }
  .money { font-size: 20px; font-weight: 800; color: #7fe39a; }
  table.sb { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.sb td, table.sb th { padding: 5px 8px; border-bottom: 1px solid #1f2940; text-align: left; }
  table.sb tr.me td { color: #ffd34d; } table.sb tr.dead td { opacity: .5; }
  #close { position: fixed; right: 10px; top: 10px; z-index: 6; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<button id="close" type="button" title="Leave">✕</button>
<div class="ov" id="lobby"><div class="card" id="lobbyCard">Loading…</div></div>
<div class="ov" id="buy" hidden><div class="card" id="buyCard"></div></div>
<div class="ov" id="board" hidden><div class="card" id="boardCard"></div></div>
<div class="ov" id="msg" hidden><div class="card" id="msgCard"></div></div>
<script type="module" src="/app/arena-cs2-live.js"></script>
</body>
</html>
