<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gregal</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
  /* Llenguatge de disseny de l'Office (Fluent): Segoe UI, reixa de 4 px,
     marges de 20 px, blau d'acció, grisos neutres. Els colors de fons i
     de text els posa el tema de l'Office (officeTheme) en arrencar; per
     defecte, clar, que és com la gent té el Word. Res de neons ni de
     marca cridanera: el panell ha de semblar una part del programa. */
  :root {
    --bg: #ffffff; --bg2: #f5f5f5; --bg3: #ebebeb;
    --text: #242424; --text2: #616161; --text3: #8a8a8a;
    --line: #e0e0e0; --line2: #c7c7c7;
    --accent: #0f6cbd; --accent-h: #115ea3; --accent-p: #0c3b5e; --on-accent: #ffffff;
    --ok: #0e700e; --warn: #8a5a00; --warn-bg: #fff8e7; --bad: #b10e1c;
    --radius: 4px;
  }
  :root[data-theme="dark"] {
    --bg: #292929; --bg2: #333333; --bg3: #3d3d3d;
    --text: #ffffff; --text2: #d6d6d6; --text3: #adadad;
    --line: #4a4a4a; --line2: #5c5c5c;
    --accent: #479ef5; --accent-h: #62abf5; --accent-p: #2886de; --on-accent: #000000;
    --ok: #54b054; --warn: #f2c661; --warn-bg: #3a3320; --bad: #f1707b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font: 14px/20px "Segoe UI", "Segoe UI Web (West European)", -apple-system, system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column;
  }
  header {
    padding: 12px 20px 8px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  header h1 { font-size: 14px; font-weight: 600; margin: 0; letter-spacing: 0; }
  header h1 small { font-weight: 400; color: var(--text3); margin-left: 6px; }
  #estat { font-size: 12px; line-height: 16px; color: var(--text2); display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #estat::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--text3); flex: none; }
  #estat.ok::before { background: var(--ok); }
  #estat.mal::before { background: var(--bad); }
  #estat.feina::before { background: var(--accent); animation: puls 1s infinite alternate; }
  @keyframes puls { from { opacity: .3 } to { opacity: 1 } }

  .modeBar { padding: 8px 20px; border-bottom: 1px solid var(--line); background: var(--bg2); font-size: 12px; line-height: 16px; color: var(--text2); }
  .commuta { display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
  .commuta input { position: absolute; opacity: 0; width: 0; height: 0; }
  .commuta .pista { width: 32px; height: 18px; border-radius: 9px; background: var(--line2); position: relative; flex: none; transition: background .15s; }
  .commuta .pista::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--bg); transition: left .15s; }
  .commuta input:checked + .pista { background: var(--accent); }
  .commuta input:checked + .pista::after { left: 16px; }
  .commuta input:focus-visible + .pista { outline: 2px solid var(--accent); outline-offset: 2px; }
  body.consulta .modeBar { color: var(--text); font-weight: 600; }
  body.consulta .soEdicio { display: none !important; }
  main { flex: 1; overflow: auto; padding: 12px 20px 16px; display: flex; flex-direction: column; gap: 12px; }
  section { display: flex; flex-direction: column; gap: 8px; }
  h2 { font-size: 12px; line-height: 16px; font-weight: 600; color: var(--text2); margin: 0; }

  /* Accions ràpides sobre la selecció: el que la gent fa al Word. */
  .xips { display: flex; flex-wrap: wrap; gap: 4px; }
  .xips[hidden] { display: none; }
  .xip {
    font: inherit; font-size: 12px; line-height: 16px;
    padding: 4px 10px; border-radius: 12px; cursor: pointer;
    background: var(--bg2); color: var(--text); border: 1px solid var(--line);
  }
  .xip:hover { background: var(--bg3); border-color: var(--line2); }
  .xip:disabled { opacity: .5; cursor: default; }

  textarea, input, select {
    width: 100%; font: inherit; color: var(--text);
    background: var(--bg); border: 1px solid var(--line2); border-radius: var(--radius);
    padding: 6px 8px; outline: none;
  }
  textarea:focus, input:focus, select:focus { border-color: var(--accent); box-shadow: inset 0 -1px 0 var(--accent); }
  textarea { min-height: 72px; resize: vertical; }
  .fila { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .fila.dreta { justify-content: flex-end; }
  .sep { flex: 1; }

  button.boto {
    font: inherit; font-weight: 600; padding: 5px 12px; min-height: 32px;
    border-radius: var(--radius); cursor: pointer;
    background: var(--bg); color: var(--text); border: 1px solid var(--line2);
  }
  button.boto:hover { background: var(--bg2); }
  button.boto.primari { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  button.boto.primari:hover { background: var(--accent-h); }
  button.boto.primari:active { background: var(--accent-p); }
  button.boto.subtil { border-color: transparent; font-weight: 400; color: var(--accent); padding-left: 6px; padding-right: 6px; }
  button.boto.subtil:hover { background: var(--bg2); }
  button:disabled { opacity: .45; cursor: default; }

  #resposta {
    flex: 1; min-height: 140px; overflow: auto;
    border: 1px solid var(--line); border-radius: var(--radius);
    padding: 10px 12px; background: var(--bg);
    font-size: 14px; line-height: 20px;
  }
  #resposta:empty::before { content: attr(data-buit); color: var(--text3); }
  #resposta h1, #resposta h2, #resposta h3 { font-size: 15px; line-height: 20px; margin: 8px 0 4px; font-weight: 600; }
  #resposta h1 { font-size: 17px; }
  #resposta p { margin: 0 0 8px; }
  #resposta ul, #resposta ol { margin: 0 0 8px; padding-left: 22px; }
  #resposta li { margin: 2px 0; }
  #resposta code { font-family: Consolas, "Cascadia Mono", monospace; font-size: 12.5px; background: var(--bg2); padding: 0 3px; border-radius: 3px; }
  #resposta pre { background: var(--bg2); padding: 8px; border-radius: var(--radius); overflow: auto; }
  #resposta table { border-collapse: collapse; margin: 4px 0 8px; }
  #resposta td, #resposta th { border: 1px solid var(--line); padding: 3px 8px; font-size: 13px; }
  #resposta th { background: var(--bg2); font-weight: 600; }

  #preg {
    border: 1px solid var(--warn); border-left-width: 4px; border-radius: var(--radius);
    padding: 8px 12px; background: var(--warn-bg); display: flex; flex-direction: column; gap: 6px;
  }
  #preg[hidden] { display: none; }
  #preg b { font-weight: 600; }
  #pregCos { font-size: 12.5px; color: var(--text2); white-space: pre-wrap; max-height: 120px; overflow: auto; }

  details { font-size: 12px; color: var(--text2); border-top: 1px solid var(--line); padding-top: 8px; }
  summary { cursor: pointer; font-weight: 600; list-style: none; }
  summary::before { content: "›"; display: inline-block; width: 12px; transition: transform .1s; }
  details[open] summary::before { transform: rotate(90deg); }
  details label { display: block; margin-top: 8px; margin-bottom: 2px; }
  .opcions { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--text2); }
  .opcions label { display: flex; align-items: center; gap: 4px; }
  .opcions input { width: auto; margin: 0; }
  .nota { font-size: 12px; line-height: 16px; color: var(--text3); }
</style>
</head>
<body>
  <!-- Els textos són en anglès per defecte; taskpane.js els passa a la
       llengua de Gregal (data-k, data-k-title, data-k-ph, data-k-ordre). -->
  <header>
    <h1>Gregal <small id="host"></small></h1>
    <div id="estat" data-k="st.starting">starting…</div>
  </header>
  <div class="modeBar">
    <label class="commuta" data-k-title="consulta.help" title="In read-only mode the agent only answers in the panel: it never inserts or replaces anything in the document. Meant for documents several people are editing at once.">
      <input type="checkbox" id="nomesConsulta" />
      <span class="pista"></span>
      <span data-k="consulta.label">Read-only: never touches the document</span>
    </label>
  </div>
  <main>
    <section>
      <h2 data-k="h.selection">With the selection</h2>
      <div class="xips" id="xipsConsulta" hidden>
        <button class="xip" data-k="xip.summarize" data-k-ordre="ord.summarize" data-ordre="Summarize the text in a short paragraph (or 3 bullet points if it is long).">Summarize</button>
        <button class="xip" data-k="xip.explain" data-k-ordre="ord.explain" data-ordre="Explain what the text says in plain words, as if to someone outside the field.">Explain</button>
        <button class="xip" data-k="xip.review" data-k-ordre="ord.review" data-ordre="Review the text and list the problems you find (clarity, errors, inconsistencies, missing points), quoting the passage for each one. Do not rewrite it.">Review</button>
        <button class="xip" data-k="xip.keyPoints" data-k-ordre="ord.keyPoints" data-ordre="Extract the key points, figures and decisions from the text as a list.">Key points</button>
        <button class="xip" data-k="xip.questions" data-k-ordre="ord.questions" data-ordre="Suggest 3–5 questions a critical reader would ask about this text.">Questions</button>
        <button class="xip" data-k="xip.toEnglish" data-k-ordre="ord.toEnglishPanel" data-ordre="Translate the text into English (show it only in the panel).">→ English</button>
        <button class="xip" data-k="xip.verify" data-k-ordre="ord.verify" data-ordre="Check the verifiable claims in the text with a web search and say which hold up, which do not and which you could not verify, citing the source.">Fact-check</button>
      </div>
      <div class="xips" id="xips">
        <button class="xip" data-k="xip.rewrite" data-k-ordre="ord.rewrite" data-ordre="Rewrite the text so it reads more clearly and smoothly, keeping its meaning, language and approximate length.">Rewrite</button>
        <button class="xip" data-k="xip.proofread" data-k-ordre="ord.proofread" data-ordre="Fix spelling, grammar and punctuation. Change only what is needed.">Proofread</button>
        <button class="xip" data-k="xip.summarize" data-k-ordre="ord.summarize" data-ordre="Summarize the text in a short paragraph (or 3 bullet points if it is long).">Summarize</button>
        <button class="xip" data-k="xip.shorten" data-k-ordre="ord.shorten" data-ordre="Make the text more concise: remove redundancy without losing information.">Shorten</button>
        <button class="xip" data-k="xip.expand" data-k-ordre="ord.expand" data-ordre="Expand the text with more detail and examples, keeping the tone.">Expand</button>
        <button class="xip" data-k="xip.formal" data-k-ordre="ord.formal" data-ordre="Rewrite the text in a more formal, professional tone.">More formal</button>
        <button class="xip" data-k="xip.toEnglish" data-k-ordre="ord.toEnglish" data-ordre="Translate the text into English.">→ English</button>
        <button class="xip" data-k="xip.toCatalan" data-k-ordre="ord.toCatalan" data-ordre="Translate the text into Catalan.">→ Catalan</button>
        <button class="xip" data-k="xip.bullets" data-k-ordre="ord.bullets" data-ordre="Turn the text into a clear bulleted list.">As bullets</button>
      </div>
      <p class="nota" id="notaSel" data-k="sel.none">Select text in the document and choose an action, or type your request below.</p>
    </section>

    <section>
      <h2 data-k="h.request">Request</h2>
      <textarea id="prompt" data-k-ph="request.ph" placeholder="e.g. Draft a two-paragraph introduction about…"></textarea>
      <div class="opcions">
        <label><input type="checkbox" id="ambSel" checked /> <span data-k="opt.includeSel">Include the selection</span></label>
        <label class="soEdicio"><input type="checkbox" id="nomesText" checked /> <span data-k="opt.textOnly">Result text only</span></label>
      </div>
      <div class="fila">
        <button id="bEnvia" class="boto primari" data-k="btn.generate">Generate</button>
        <button id="bAtura" class="boto" disabled data-k="btn.stop">Stop</button>
        <span class="sep"></span>
        <button id="bNeteja" class="boto subtil" data-k-title="btn.clearTitle" title="Clear the request and the result" data-k="btn.clear">Clear</button>
      </div>
    </section>

    <div id="preg" hidden>
      <b id="pregTitol" data-k="q.title">Question</b>
      <div id="pregCos"></div>
      <div class="fila" id="pregBtns"></div>
    </div>

    <section style="flex:1; min-height: 160px;">
      <h2 data-k="h.result">Result</h2>
      <div id="resposta" aria-live="polite" data-buit="The result appears here. You can replace the selection or insert it at the cursor."></div>
      <div class="fila dreta">
        <button id="bCopia" class="boto subtil" disabled data-k="btn.copy">Copy</button>
        <button id="bInsereix" class="boto soEdicio" disabled data-k-title="btn.insertTitle" title="Insert the result at the cursor" data-k="btn.insert">Insert</button>
        <button id="bSubstitueix" class="boto primari soEdicio" disabled data-k-title="btn.replaceTitle" title="Replace the selected text with the result" data-k="btn.replace">Replace selection</button>
      </div>
    </section>

    <details>
      <summary data-k="conn.title">Connection</summary>
      <label for="srv" data-k="conn.server">Gregal server</label>
      <input id="srv" value="http://127.0.0.1:8097" />
      <label for="tok" data-k="conn.token">Token (if the server requires one)</label>
      <input id="tok" type="password" data-k-ph="conn.optional" placeholder="(optional)" />
      <div class="fila" style="margin-top:8px"><button id="bProva" class="boto" data-k="conn.test">Test connection</button></div>
    </details>
  </main>
  <script src="./taskpane.js"></script>
</body>
</html>
