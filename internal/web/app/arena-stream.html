<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gregal Arena · Live</title>
<style>
  :root { --vw:1vw; --vh:1vh; --bg:#070a14; --panel:rgba(13,18,34,.9); --line:rgba(255,255,255,.12); --ink:#f3f5fb; --muted:#9aa4bd; --accent:#ffd400; --a:#3e7bfa; --b:#e5484d; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:radial-gradient(1400px 700px at 50% -20%, #1d2a5c 0%, var(--bg) 62%); color:var(--ink); font:16px/1.45 "Segoe UI", system-ui, sans-serif; overflow:hidden; }
  /* Barra de dalt */
  .top { position:fixed; top:0; left:0; right:0; height:62px; display:flex; align-items:center; gap:16px; padding:0 24px; z-index:6; background:linear-gradient(180deg, rgba(0,0,0,.65), transparent); }
  .logo { font-weight:900; letter-spacing:.16em; font-size:19px; white-space:nowrap; } .logo span { color:var(--accent); }
  .comp { color:var(--muted); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .seg { margin-left:auto; padding:5px 14px; border-radius:999px; background:var(--panel); border:1px solid var(--line); font-weight:700; white-space:nowrap; }
  .live { padding:4px 10px; border-radius:6px; background:#e5484d; font-weight:800; font-size:12px; letter-spacing:.12em; animation:pulse 1.6s infinite; }
  @keyframes pulse { 50% { opacity:.55; } }
  .clock { color:var(--muted); font-variant-numeric:tabular-nums; }
  .voice { border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:8px; padding:5px 10px; cursor:pointer; font:inherit; font-size:13px; }
  .voice.on { background:var(--accent); color:#111; }
  .voice.blocked { background:#e5484d; color:#fff; animation:pulse 1.2s infinite; }
  /* Als segments de panell, el subtítol baixa al lloc del marcador. */
  body.paneled .caption { bottom:62px; }
  /* Escenari del partit */
  .stage-wrap { position:fixed; inset:66px 24px 150px 24px; display:flex; align-items:center; justify-content:center; transition:opacity .4s; }
  canvas { width:100%; height:100%; max-width:calc((calc(var(--vh) * 100) - 216px) * 16 / 9); max-height:calc((calc(var(--vw) * 100) - 48px) * 9 / 16); border-radius:16px; box-shadow:0 30px 90px rgba(0,0,0,.65); background:#0b1020; }
  .lower { position:fixed; left:24px; right:24px; bottom:58px; height:84px; display:grid; grid-template-columns:1fr auto 1fr; gap:14px; z-index:5; }
  .pcard { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:10px 16px; overflow:hidden; display:flex; flex-direction:column; justify-content:center; }
  .pcard.a { border-left:6px solid var(--a); } .pcard.b { border-right:6px solid var(--b); text-align:right; }
  .pcard .who { font-size:22px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pcard .motto { color:var(--muted); font-style:italic; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  /* La crida de cada equip: què ha decidit i la regla del .md que l'ha portat. */
  .caption.quiet #capText { display:none; } .caption.quiet { padding:8px 14px; }
  .pcard .call { display:none; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pcard .call b { color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.03em; } .pcard .call q { color:#d6dbea; font-style:italic; }
  .pcard.calling .motto { display:none; } .pcard.calling .call { display:block; animation:callIn .35s ease-out; }
  @keyframes callIn { from { opacity:0; transform:translateY(6px); } }
  .lower { height:96px !important; }
  .close { position:fixed; top:14px; right:14px; z-index:10; border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:8px; padding:5px 10px; cursor:pointer; font:inherit; font-size:13px; }
  .again { display:flex; gap:12px; } .again button { font:inherit; font-size:18px; font-weight:800; border:0; border-radius:12px; padding:12px 22px; cursor:pointer; background:var(--accent); color:#111; } .again button.ghost { background:var(--panel); color:var(--ink); border:1px solid var(--line); }
  .score { align-self:center; font-size:38px; font-weight:900; min-width:170px; text-align:center; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px 18px; }
  /* Subtítol del narrador */
  .caption { position:fixed; left:50%; bottom:156px; transform:translate(-50%, 20px); max-width:min(980px, calc(var(--vw) * 90)); padding:12px 20px 12px 16px; display:flex; gap:12px; align-items:flex-start;
    background:rgba(8,10,22,.92); border:1px solid var(--line); border-left:5px solid var(--accent); border-radius:12px; z-index:7; opacity:0; transition:opacity .35s, transform .35s; font-size:20px; }
  .caption.on { opacity:1; transform:translate(-50%, 0); }
  .caption b { color:var(--accent); white-space:nowrap; font-size:14px; letter-spacing:.08em; text-transform:uppercase; padding-top:4px; }
  /* Plafons de segment (presentació, prèvia, resultat…) */
  .panel { position:fixed; inset:76px calc(var(--vw) * 6) 190px calc(var(--vw) * 6); display:flex; flex-direction:column; justify-content:center; gap:22px; z-index:4; opacity:0; pointer-events:none; transition:opacity .45s; }
  .panel.on { opacity:1; }
  .kicker { color:var(--accent); font-weight:800; letter-spacing:.2em; text-transform:uppercase; font-size:15px; }
  .h1 { font-size:clamp(34px, calc(var(--vw) * 5.2), 70px); font-weight:900; line-height:1.05; margin:0; }
  .h2 { font-size:clamp(22px, calc(var(--vw) * 2.6), 34px); font-weight:800; margin:0; }
  .lead { font-size:clamp(17px, calc(var(--vw) * 1.7), 24px); color:#d6dbea; max-width:1100px; }
  .steps { display:grid; grid-template-columns:repeat(3, 1fr); gap:18px; }
  .step { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:18px 20px; font-size:18px; }
  .step b { display:block; color:var(--accent); font-size:14px; letter-spacing:.1em; text-transform:uppercase; margin-bottom:6px; }
  .vs { display:grid; grid-template-columns:1fr auto 1fr; gap:26px; align-items:center; }
  .big { background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:26px 28px; }
  .big.a { border-top:6px solid var(--a); } .big.b { border-top:6px solid var(--b); text-align:right; }
  .big .who { font-size:clamp(26px, calc(var(--vw) * 3), 44px); font-weight:900; } .big .motto { color:var(--muted); font-style:italic; font-size:19px; }
  .vsmark { font-size:56px; font-weight:900; color:var(--accent); }
  .quote { background:rgba(255,212,0,.08); border-left:5px solid var(--accent); border-radius:12px; padding:16px 20px; font-size:clamp(17px, calc(var(--vw) * 1.6), 23px); }
  .quote small { display:block; color:var(--accent); font-weight:800; letter-spacing:.1em; text-transform:uppercase; font-size:13px; margin-bottom:6px; }
  .rule { font-family:ui-monospace, Consolas, monospace; background:rgba(255,255,255,.06); border-radius:10px; padding:12px 16px; font-size:clamp(15px, calc(var(--vw) * 1.4), 20px); }
  .result { font-size:clamp(40px, calc(var(--vw) * 5), 72px); font-weight:900; }
  .winner { color:var(--accent); font-size:clamp(22px, calc(var(--vw) * 2.4), 32px); font-weight:800; }
  table { width:100%; border-collapse:collapse; font-size:clamp(16px, calc(var(--vw) * 1.5), 22px); }
  th, td { padding:9px 12px; border-bottom:1px solid var(--line); text-align:left; }
  th { color:var(--muted); font-size:13px; text-transform:uppercase; letter-spacing:.08em; }
  td.pts { font-weight:900; color:var(--accent); } tr.top td:first-child { color:var(--accent); }
  .two { display:grid; grid-template-columns:1.1fr 1fr; gap:26px; align-items:start; }
  .champ { font-size:clamp(30px, calc(var(--vw) * 4), 56px); font-weight:900; } .champ small { display:block; color:var(--muted); font-size:18px; font-weight:600; }
  /* Rètol de baix (tips i el que ve) */
  .ticker { position:fixed; left:0; right:0; bottom:0; height:44px; background:rgba(4,6,14,.94); border-top:1px solid var(--line); overflow:hidden; z-index:6; display:flex; align-items:center; }
  .ticker .tag { flex:0 0 auto; height:100%; display:flex; align-items:center; padding:0 18px; background:var(--accent); color:#111; font-weight:900; letter-spacing:.1em; font-size:13px; }
  .ticker .run { white-space:nowrap; animation:scroll var(--dur, 60s) linear infinite; padding-left:100%; font-size:16px; color:#dfe4f2; }
  .ticker .run span { margin-right:60px; } .ticker .run b { color:var(--accent); }
  @keyframes scroll { to { transform:translateX(-100%); } }
  /* Transició (cortina) */
  .wipe { position:fixed; inset:0; z-index:9; pointer-events:none; transform:translateX(-110%); background:linear-gradient(100deg, var(--a) 0 32%, var(--accent) 32% 40%, var(--b) 40% 100%); }
  .wipe.go { animation:wipe 1s cubic-bezier(.7,0,.3,1); }
  .wipe::after { content:'GREGAL ARENA'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-weight:900; letter-spacing:.3em; font-size:48px; color:#fff; text-shadow:0 4px 20px rgba(0,0,0,.4); }
  @keyframes wipe { 0% { transform:translateX(-110%); } 45%, 55% { transform:translateX(0); } 100% { transform:translateX(110%); } }
  .hide { display:none !important; }
  /* Resum del partit: els moments del prompt en línia de temps. */
  .sum { display:grid; grid-template-columns:minmax(0, 1.05fr) minmax(0, 1fr); gap:26px; align-items:start; }
  .sum .quote .txt { display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; }
  .sum .result { font-size:clamp(30px, calc(var(--vw) * 3.6), 52px); }
  .tl { display:flex; flex-direction:column; gap:8px; }
  .tl .mo { background:var(--panel); border:1px solid var(--line); border-left:6px solid var(--mc); border-radius:10px; padding:7px 12px; font-size:15px; }
  .tl .mo b { color:var(--mc); } .tl .mo q { quotes:none; display:block; color:var(--muted); font-family:ui-monospace, Consolas, monospace; font-size:13px; font-style:normal; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .coach { display:grid; grid-template-columns:auto 1fr; gap:4px 14px; font-size:17px; } .coach b { font-weight:800; }
  .sum .quote { font-size:clamp(15px, calc(var(--vw) * 1.25), 19px); padding:12px 16px; }
  .sum .rule { font-size:clamp(14px, calc(var(--vw) * 1.15), 17px); padding:8px 12px; }
  #momentHost { position:fixed; left:0; right:0; top:66px; height:0; z-index:8; }
  /* Finestres petites: l'escenari es pinta a 1280×720 i s'escala sencer, com una tele. */
  body.fit { --vw:12.8px; --vh:7.2px; }
  body.fit #tv { position:fixed; left:0; top:0; width:1280px; height:720px; overflow:hidden; transform-origin:0 0; }
</style>
</head>
<body>
<div id="tv">
<div class="top"><div class="logo">GREGAL <span>ARENA</span></div><div class="comp" id="comp"></div><div class="seg" id="seg"></div><div class="live hide" id="live">LIVE</div><div class="clock" id="clock"></div><button class="voice" id="voice" type="button"></button></div>
<div class="stage-wrap" id="stageWrap" style="opacity:0"><canvas id="cv"></canvas></div>
<div class="lower hide" id="lower"><div class="pcard a"><div class="who" id="nameA"></div><div class="motto" id="mottoA"></div><div class="call" id="callA"></div></div><div class="score" id="score">0 - 0</div><div class="pcard b"><div class="who" id="nameB"></div><div class="motto" id="mottoB"></div><div class="call" id="callB"></div></div></div>
<div id="momentHost"></div>
<div class="caption" id="caption"><b id="capWho"></b><span id="capText"></span></div>
<div class="panel" id="panel"></div>
<div class="ticker"><div class="tag" id="tickerTag"></div><div class="run" id="ticker"></div></div>
<div class="wipe" id="wipe"></div>
</div>
<script type="module">
// La retransmissió de l'Arena com un programa de tele: obertura, explicació de
// cada joc el primer cop, prèvia de l'analista, el partit amb els comentaris
// del narrador (subtítols i, si es vol, veu), resultat amb l'anàlisi i la
// regla del .md que ho va decidir, classificació i el que ve, amb cortines
// entre segments i un rètol de consells a baix.
// #token=<clau> o #spectator=<clau de l'enllaç d'espectador>, &lang=ca|en.
import { makeView, LESSONS, EXPLAIN } from './arena-views.js';
import { exportVideo, momentsByEvent, showMomentCard } from './arena-export.js';

// Per sota de 1280×720 tot es pinta a aquesta mida i s'escala (amb bandes),
// que una retransmissió s'ha de veure igual en un portàtil que a l'OBS.
// Un ancestre amb transform fa de marc als elements fixos de dins.
function fitTV() {
  const z = Math.min(innerWidth / 1280, innerHeight / 720), on = z < 1, tv = document.getElementById('tv');
  document.body.classList.toggle('fit', on);
  tv.style.transform = on ? `translate(${(innerWidth - 1280 * z) / 2}px, ${(innerHeight - 720 * z) / 2}px) scale(${z})` : '';
}
fitTV(); addEventListener('resize', fitTV);
const q = new URLSearchParams(location.hash.slice(1));
const lang = 'en'; // els jocs van sempre en anglès
const headers = q.get('spectator') ? { 'X-Arena-Spectator': q.get('spectator') } : q.get('token') ? { Authorization: 'Bearer ' + q.get('token') } : {};
const get = path => fetch(path, { headers }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
const $ = id => document.getElementById(id);
const esc = v => String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const L = lang === 'ca' ? {
  waiting: 'Esperant la competició…', soon: 'Comença aviat', opening: 'Comença la competició', next: 'A continuació', result: 'Resultat', table: 'Classificació',
  champions: 'Campions', win: 'guanya', draw: 'Empat', p: 'Jugador', pj: 'PJ', w: 'G', d: 'E', l: 'P', pts: 'Pts', preview: 'Prèvia', analysis: 'L’anàlisi',
  keyRule: 'La regla que ho va decidir', live: 'En directe', explain: 'Com es juga', caster: 'Narrador', analyst: 'Analista', voiceOn: '🔊 Veu', voiceOff: '🔈 Sense veu', voiceBlocked: '🔇 Clica per sentir-ho', noVoice: '🔇 Només subtítols (sense veu instal·lada)',
  how1: ['Dos equips idèntics', 'Mateixos jugadors, mateixos atributs. L’única diferència és el .md de cada jugador.'],
  how2: ['El mateix model per a tothom', 'A cada decisió, el model llegeix el .md del seu equip i la situació, i decideix.'],
  how3: ['Guanya el millor prompt', 'Instruccions clares, concretes i que llegeixen el rival guanyen a les vagues.'],
  practice: 'Partit de prova', demo: 'Partit de mostra', replay: '▶ Torna-ho a veure', close: 'Tanca', end: 'Final del partit', callTip: 'A sota de cada equip: què ha decidit i la regla del seu .md que l’hi ha portat.',
  stakes: 'Els dos primers de cada grup passen a les eliminatòries.', preparing: 'S’està jugant el partit següent: tornem de seguida.', tips: 'CONSELL', upnext: 'ARA VE',
  summary: 'Resum del partit', moments: 'Moments del prompt', noMoments: 'Cap moment del prompt en aquest partit.', coach: 'coach', followed: 'ha seguit el .md', exportVideo: '⬇ Exporta el vídeo',
} : {
  waiting: 'Waiting for the competition…', soon: 'Starting soon', opening: 'The competition starts', next: 'Up next', result: 'Result', table: 'Standings',
  champions: 'Champions', win: 'wins', draw: 'Draw', p: 'Player', pj: 'P', w: 'W', d: 'D', l: 'L', pts: 'Pts', preview: 'Preview', analysis: 'The analysis',
  keyRule: 'The rule that decided it', live: 'Live', explain: 'How it is played', caster: 'Caster', analyst: 'Analyst', voiceOn: '🔊 Voice', voiceOff: '🔈 Muted', voiceBlocked: '🔇 Click for sound', noVoice: '🔇 Captions only (no voice installed)',
  how1: ['Two identical teams', 'Same players, same attributes. The only difference is each player’s .md.'],
  how2: ['The same model for everyone', 'At every decision, the model reads its team’s .md and the situation, and decides.'],
  how3: ['The best prompt wins', 'Clear, concrete instructions that read the opponent beat vague ones.'],
  practice: 'Practice game', demo: 'Demo match', replay: '▶ Watch it again', close: 'Close', end: 'Full time', callTip: 'Under each team: what it decided and the rule of its .md that led there.',
  stakes: 'The top two of each group go through to the playoffs.', preparing: 'The next match is being played: back in a moment.', tips: 'TIP', upnext: 'UP NEXT',
  summary: 'Match summary', moments: 'Prompt moments', noMoments: 'No prompt moments in this match.', coach: 'coach', followed: 'followed its .md', exportVideo: '⬇ Export video',
};
const GAME = { nfl: 'NFL', cs2: 'Counter-Strike 2', lol: 'League of Legends' };

// ---- so: veu dels narradors (pregravada al servidor) i efectes ----
// El so, encès per defecte (només queda apagat si algú l'ha apagat).
let soundOn = localStorage.getItem('arenaVoice') !== '0';
let script = null;
// El navegador no deixa sonar res fins que l'espectador hi clica: llavors el
// botó ho demana.
let soundBlocked = false;
// Sense veus instal·lades: ho diu (només subtítols), no fa veure que sona.
const paintVoice = () => { $('voice').textContent = soundBlocked ? L.voiceBlocked : soundOn && script && script.voice === false ? L.noVoice : soundOn ? L.voiceOn : L.voiceOff; $('voice').classList.toggle('on', soundOn && !soundBlocked); $('voice').classList.toggle('blocked', soundBlocked); };
$('voice').onclick = () => { if (soundBlocked) { soundBlocked = false; sfx.start(); paintVoice(); return; } soundOn = !soundOn; localStorage.setItem('arenaVoice', soundOn ? '1' : '0'); if (soundOn) sfx.start(); else { sfx.stop(); stopVoice(); } paintVoice(); };
paintVoice();

// Efectes generats amb WebAudio (cap fitxer): ambient d'estadi, rugit del
// públic, cortina i sintonia.
const sfx = {
  ctx: null, amb: null, ambGain: null, master: null,
  start() {
    if (!this.ctx) {
      const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
      this.ctx = new C(); this.master = this.ctx.createGain(); this.master.gain.value = .9; this.master.connect(this.ctx.destination);
    }
    this.ctx.resume();
  },
  stop() { if (this.ctx) this.ctx.suspend(); },
  noise(secs) {
    const b = this.ctx.createBuffer(1, this.ctx.sampleRate * secs, this.ctx.sampleRate), d = b.getChannelData(0);
    let last = 0; for (let i = 0; i < d.length; i++) { last = (last + .02 * (Math.random() * 2 - 1)) / 1.02; d[i] = last * 3.5; } // soroll marró: públic llunyà
    return b;
  },
  ambience(on) {
    if (!this.ctx || !soundOn) return;
    if (on && !this.amb) {
      const src = this.ctx.createBufferSource(); src.buffer = this.noise(4); src.loop = true;
      const bp = this.ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = .6;
      this.ambGain = this.ctx.createGain(); this.ambGain.gain.value = 0;
      src.connect(bp); bp.connect(this.ambGain); this.ambGain.connect(this.master); src.start();
      this.ambGain.gain.linearRampToValueAtTime(.18, this.ctx.currentTime + 2);
      this.amb = src;
    } else if (!on && this.amb) {
      const a = this.amb, g = this.ambGain; g.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 1.5); setTimeout(() => a.stop(), 1600); this.amb = null;
    }
  },
  duck(on) { if (this.ambGain && this.ctx) this.ambGain.gain.linearRampToValueAtTime(on ? .07 : .18, this.ctx.currentTime + .4); },
  roar(big) {
    if (!this.ctx || !soundOn) return;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise(4);
    const bp = this.ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1100; bp.Q.value = .5;
    const g = this.ctx.createGain(), t = this.ctx.currentTime, peak = big ? .9 : .5;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(peak, t + .35); g.gain.exponentialRampToValueAtTime(.001, t + (big ? 3.8 : 2.4));
    src.connect(bp); bp.connect(g); g.connect(this.master); src.start(); src.stop(t + 4);
  },
  whoosh() {
    if (!this.ctx || !soundOn) return;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise(1.2);
    const f = this.ctx.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 2; const t = this.ctx.currentTime;
    f.frequency.setValueAtTime(300, t); f.frequency.exponentialRampToValueAtTime(4000, t + .5); f.frequency.exponentialRampToValueAtTime(400, t + 1);
    const g = this.ctx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.6, t + .45); g.gain.linearRampToValueAtTime(0, t + 1);
    src.connect(f); f.connect(g); g.connect(this.master); src.start(); src.stop(t + 1.2);
  },
  sting() {
    if (!this.ctx || !soundOn) return;
    const t = this.ctx.currentTime;
    [[523.25, 0], [659.25, .12], [783.99, .24], [1046.5, .36]].forEach(([f, d]) => {
      const o = this.ctx.createOscillator(), g = this.ctx.createGain(); o.type = 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(0, t + d); g.gain.linearRampToValueAtTime(.18, t + d + .03); g.gain.exponentialRampToValueAtTime(.001, t + d + .9);
      o.connect(g); g.connect(this.master); o.start(t + d); o.stop(t + d + 1);
    });
  },
};

// Amb el so recordat d'abans, s'intenta engegar; si el navegador ho atura, es demana el clic.
if (soundOn) { sfx.start(); setTimeout(() => { if (sfx.ctx && sfx.ctx.state !== 'running') { soundBlocked = true; paintVoice(); } }, 600); }

// La veu: l'àudio que el servidor ha generat per a cada frase. Si encara no hi
// és, s'espera una mica; sense veus instal·lades, només subtítols.
let voiceEl = null;
function stopVoice() { if (voiceEl) { voiceEl.pause(); voiceEl = null; } sfx.duck(false); }
async function playVoice(key) {
  if (!soundOn || !key) return;
  for (let i = 0; i < 16; i++) {
    let r;
    try { r = await fetch('/api/arena/voice?k=' + encodeURIComponent(key), { headers }); } catch (e) { return; }
    if (r.ok) {
      const url = URL.createObjectURL(await r.blob());
      stopVoice();
      const a = new Audio(url); voiceEl = a; sfx.duck(true);
      await new Promise(res => { a.onended = res; a.onerror = res; a.play().catch(e => { if (e && e.name === 'NotAllowedError') { soundBlocked = true; paintVoice(); } res(); }); });
      if (voiceEl === a) { voiceEl = null; sfx.duck(false); }
      URL.revokeObjectURL(url);
      return;
    }
    if (r.status !== 404) return;
    await sleep(1500);
  }
}
let capTimer = 0, capSeq = 0;
// caption mostra el subtítol i en diu la veu; torna quan la veu acaba (o de seguida).
function caption(who, text, secs = 8, audio = '') {
  if (!text) return Promise.resolve();
  const seq = ++capSeq;
  // Amb un panell a la pantalla, el text ja hi és: només es diu (i es marca qui parla).
  const voiced = soundOn && audio && script && script.voice, quiet = document.body.classList.contains('paneled');
  $('capWho').textContent = (quiet ? '🔊 ' : '') + who; $('capText').textContent = text;
  $('caption').classList.toggle('quiet', quiet);
  if (!quiet || voiced) $('caption').classList.add('on'); else $('caption').classList.remove('on');
  clearTimeout(capTimer); capTimer = setTimeout(() => $('caption').classList.remove('on'), secs * 1000);
  // Sense veu, el segment espera el temps de llegir-ho (~20 caràcters per segon).
  const said = voiced ? playVoice(audio) : sleep(Math.min(45000, text.length * 50) / Math.max(1, +q.get("speed") || 1));
  return said.then(() => { if (seq !== capSeq) return; clearTimeout(capTimer); capTimer = setTimeout(() => $('caption').classList.remove('on'), 1500); });
}
// Espera el temps mínim del segment i que el narrador acabi.
// A la demo (#speed=2) els panells també passen més de pressa.
const hold = (ms, voice) => Promise.all([sleep(ms / Math.max(1, +q.get("speed") || 1)), voice || Promise.resolve()]);

function ticker(items) {
  const html = items.map(([tag, t]) => `<span><b>${esc(tag)}</b> · ${esc(t)}</span>`).join('');
  if ($('ticker').dataset.html === html) return;
  $('ticker').dataset.html = html; $('ticker').innerHTML = html;
  $('ticker').style.setProperty('--dur', Math.max(40, items.length * 12) + 's');
  $('tickerTag').textContent = 'GREGAL ARENA';
}

const shown = new Set(), explained = new Set();
let opened = false, busy = false, view = null;

async function pollComp() {
  try { const r = await get('/api/arena/stream'); comp = single ? null : r.competition; script = r.script || null; } catch (e) {}
  paintVoice();
  if (comp) {
    $('comp').textContent = comp.title;
    const tips = LESSONS[lang].map(([h, p]) => [L.tips, h + ': ' + p]);
    const nxt = comp.schedule.find(s => !s.done && !(s.match && shown.has(s.match)));
    if (nxt) tips.splice(1, 0, [L.upnext, nxt.pending ? `${GAME[nxt.game]} · ${nxt.stage}` : `${name(nxt.a)} vs ${name(nxt.b)} · ${GAME[nxt.game]} · ${nxt.stage}`]);
    ticker(tips);
  } else ticker(LESSONS[lang].map(([h, p]) => [L.tips, h + ': ' + p]));
  if (!single) setTimeout(pollComp, 4000);
}

const motto = o => (comp && comp.titles && comp.titles[o]) || titles[o] || '';

async function wipe(swap) {

  const w = $('wipe'); w.classList.remove('go'); void w.offsetWidth; w.classList.add('go');
  await sleep(480); swap(); sfx.sting(); await sleep(560);
}
function panel(html) { $('panel').innerHTML = html; $('panel').classList.add('on'); document.body.classList.add('paneled'); $('stageWrap').style.opacity = 0; $('lower').classList.add('hide'); $('live').classList.add('hide'); }
function hidePanel() { $('panel').classList.remove('on'); document.body.classList.remove('paneled'); }

async function fetchMatch(id, after = 999999) { return get('/api/arena/match?id=' + encodeURIComponent(id) + '&after=' + after); }

// Al LoL el mapa posa l'equip blau a l'esquerra, sigui el primer o el segon:
// tota la retransmissió va en el mateix ordre que el que es veu.
async function sideOrder(sl) {
  if (sl.flip !== undefined) return;
  sl.flip = false;
  if (sl.game !== 'lol') return;
  for (let i = 0; i < 20; i++) {
    try { const m0 = await fetchMatch(sl.match, 0); if (m0.meta) { sl.flip = m0.meta.blue === 1; return; } } catch (e) {}
    await sleep(1500);
  }
}
const LR = sl => sl.flip ? [sl.b, sl.a] : [sl.a, sl.b];
const LRs = (sl, sc) => sl.flip ? [sc[1], sc[0]] : [sc[0], sc[1]];

async function segPreview(sl) {
  await sideOrder(sl);
  const [A, B] = LR(sl);
  segLabel(L.preview + ' · ' + sl.stage);
  let m = null;
  for (let i = 0; i < 12; i++) { try { m = await fetchMatch(sl.match); } catch (e) {} if (m && (m.preview || m.status !== 'pregame')) break; await sleep(2500); }
  const pv = (m && m.preview) || '';
  await wipe(() => panel(`<div class="kicker">${esc(GAME[sl.game] || sl.game)} · ${esc(sl.stage)}</div>
    <div class="vs"><div class="big a"><div class="who">${esc(name(A))}</div><div class="motto">${esc(motto(A))}</div></div><div class="vsmark">VS</div>
    <div class="big b"><div class="who">${esc(name(B))}</div><div class="motto">${esc(motto(B))}</div></div></div>
    ${pv ? `<div class="quote"><small>${esc(L.preview)} · ${esc(L.analyst)}</small>${esc(pv)}</div>` : ''}`));
  await hold(pv ? 14000 : 9000, pv ? caption(L.analyst, pv, 40, m && m.preview_audio) : null);
}

// Una decisió en paraules: els valors del JSON, sense guions baixos.
function callText(d) {
  if (!d) return '';
  const v = d.decision && typeof d.decision === 'object' ? Object.values(d.decision).flat().filter(x => typeof x === 'string' && x && x !== 'normal') : [];
  return (v.length ? v.join(' · ') : (d.short || '')).replace(/_/g, ' ');
}
function showCall(side, d) {
  const card = $(side ? 'callB' : 'callA');
  if (!d) return;
  const mark = d.fallback ? '⚠ ' : d.rule_found ? '✓ ' : '';
  card.innerHTML = `${mark}<b>${esc(callText(d))}</b>${d.rule ? ` <q>${esc(d.rule)}</q>` : d.why ? ` <q>${esc(d.why)}</q>` : ''}`;
  card.parentElement.classList.remove('calling'); void card.offsetWidth; card.parentElement.classList.add('calling');
}

async function segLive(sl) {
  segLabel(L.live + ' · ' + (GAME[sl.game] || sl.game) + ' · ' + sl.stage);
  let latest = null;
  const lines = new Map(), calls = new Map();
  let shown = [0, 0];
  $('nameA').parentElement.classList.remove('calling'); $('nameB').parentElement.classList.remove('calling');
  await sideOrder(sl);
  const flip = sl.flip, [L0, R0] = LR(sl);
  const sc2 = sc => LRs(sl, sc).join(' - ');
  let moments = new Map(), slowT = 0;
  const base = Math.max(1, +q.get("speed") || 1);
  const fm = after => fetchMatch(sl.match, after).then(m => {
    latest = m; (m.lines || []).forEach(l => lines.set(l.n, l));
    if (m.analysis && m.analysis.moments) moments = momentsByEvent(m);
    (m.decisions || []).forEach(d => { const c = calls.get(d.n) || []; c[d.side] = d; calls.set(d.n, c); });
    $('live').classList.toggle('hide', m.status !== 'live');
    return m;
  });
  await wipe(() => {
    hidePanel();
    $('stageWrap').style.opacity = 1; $('lower').classList.remove('hide');
    $('score').textContent = '0 - 0';
    $('nameA').textContent = name(L0); $('nameB').textContent = name(R0);
    $('mottoA').textContent = motto(L0); $('mottoB').textContent = motto(R0);
  });
  if (view) view.destroy();
  sfx.ambience(true);
  view = await makeView(sl.game, $('cv'), { lang, fetchMatch: fm, onEvent: e => {
    // El marcador de baix va amb el que es veu, no amb l'últim que ha arribat.
    // A l'NFL l'esdeveniment arriba quan comença la jugada i porta el marcador
    // de després: es mostra el de la jugada anterior.
    if (e && Array.isArray(e.score)) {
      const sc = sl.game === 'nfl' ? shown : e.score; shown = e.score;
      $('score').textContent = sc2(sc);
    }
    if (e && e.decision && calls.has(e.decision)) { const c = calls.get(e.decision); showCall(flip ? 1 : 0, c[0]); showCall(flip ? 0 : 1, c[1]); }
    if (e && e.hl) sfx.roar(/touchdown|ace|baron|nexus|win|guanya|TOUCHDOWN/i.test(e.text || ''));
    const l = e && lines.get(e.n); if (l) caption(L.caster, l.text, 9, l.audio);
    // Un moment del prompt: la targeta, la sintonia i una mica a càmera lenta.
    const mo = e && moments.get(e.n);
    if (mo) {
      const left = (flip ? 1 : 0) === mo.side;
      showMomentCard($('momentHost'), mo, name(mo.side ? sl.b : sl.a), left ? '#3e7bfa' : '#e5484d', { secs: 5.5, big: true });
      sfx.sting();
      if (view) { view.setSpeed(base * .5); clearTimeout(slowT); slowT = setTimeout(() => view && view.setSpeed(base), 3500); }
    }
  } });
  // Demo (o qui ho demani): més de pressa, «#speed=2».
  if (+q.get("speed") > 1) view.setSpeed(+q.get("speed"));
  // Els moments es calculen al final: d'un partit acabat ja hi són.
  fetchMatch(sl.match).then(m => { if (m.analysis && m.analysis.moments) moments = momentsByEvent(m); }).catch(() => {});
  // Els comentaris arriben una mica després de les jugades: es tornen a llegir.
  const refresh = setInterval(() => fetchMatch(sl.match).then(m => (m.lines || []).forEach(l => lines.set(l.n, l))).catch(() => {}), 6000);
  while (!view.isFinished()) await sleep(1000);
  clearInterval(refresh); clearTimeout(slowT);
  if (latest) $('score').textContent = sc2(latest.score);
  sfx.roar(true);
  await sleep(2500);
  sfx.ambience(false);
  return latest;
}

async function segResult(sl) {

  await hold(a ? 16000 : 9000, a ? caption(L.analyst, a.headline + '. ' + a.text, 60, a.audio) : null);

// Resum del partit: marcador, els moments del prompt en ordre, l'anàlisi, la
// regla que ho va decidir i, per equip, la nota del coach i quant ha seguit el .md.
async function segSummary(sl) {
  let m = sl.final;
  for (let i = 0; i < 4 && m && !(m.feedback && (m.feedback[0] || m.feedback[1])); i++) { await sleep(2500); try { m = await fetchMatch(sl.match); } catch (e) {} }
  if (!m) return;
  const [A, B] = LR(sl), team = s => name(s ? sl.b : sl.a);
  const col = s => ((sl.flip ? 1 : 0) === s ? 'var(--a)' : 'var(--b)');
  const an = m.analysis || {}, mos = an.moments || [];
  const coach = s => { const f = (m.feedback || [])[s]; return f && f.scores ? Object.values(f.scores).reduce((x, y) => x + (+y || 0), 0) + '/25' : '—'; };
  const fol = m.followed || [0, 0];
  const w = m.winner >= 0 ? team(m.winner) : '';
  segLabel(L.summary);
  await wipe(() => panel(`<div class="kicker">${esc(L.summary)} · ${esc(GAME[sl.game] || sl.game)}</div>
    <div class="sum"><div style="display:flex;flex-direction:column;gap:12px">
      <div class="result">${esc(name(A))} ${LRs(sl, m.score).join(' - ')} ${esc(name(B))}</div>
      <div class="winner">${w ? '🏆 ' + esc(w) + ' ' + esc(L.win) : esc(L.draw)}</div>
      ${an.headline ? `<div class="quote"><small>${esc(L.analysis)} · ${esc(an.headline)}</small><div class="txt">${esc(an.text)}</div></div>` : ''}
      ${an.rule ? `<div><div class="kicker" style="font-size:12px">${esc(L.keyRule)} · ${esc(team(an.side === 1 ? 1 : 0))}</div><div class="rule">«${esc(an.rule)}»</div></div>` : ''}
      <div class="coach">${[0, 1].map(s => `<b style="color:${col(s)}">${esc(team(s))}</b><span>${esc(L.coach)} ${esc(coach(s))} · ${esc(L.followed)} ${Math.round((fol[s] || 0) * 100)}%</span>`).join('')}</div>
    </div><div><div class="kicker" style="margin-bottom:8px">📋 ${esc(L.moments)}</div><div class="tl">${mos.map((mo, i) =>
      `<div class="mo" style="--mc:${col(mo.side)}"><b>${i + 1}. ${esc(team(mo.side))}</b> · ${esc(mo.what)}<q>«${esc(mo.rule)}»</q></div>`).join('') || `<div class="lead">${esc(L.noMoments)}</div>`}</div></div></div>`));
  await hold(18000);
}

}

async function director() {
  if (busy) return;
  busy = true;
  try {
    if (!comp) { waitingPanel(L.waiting); return; }
    // Obert quan ja s'havia acabat: els campions, un sol cop, i s'hi queda.
    if (comp.status === 'done' && (shown.size === 0 || shown.has(-1))) { if (!shown.has(-1)) { shown.add(-1); await segChampions(); } return; }
    if (!opened && (comp.status === 'running' || comp.status === 'ready')) { opened = true; await segOpening(); }
    // Primer cop: comença pel partit en marxa, no des del principi.
    // Cada partit es mira un cop (per id): una eliminatòria al millor de 3 en
    // té diversos, i cadascun té la seva prèvia, directe i resultat.
    const from = shown.size === 0 && comp.status === 'running' ? Math.max(0, comp.current) : 0;
    let idx = -1, mid = '';
    for (let i = from; i < comp.schedule.length && idx < 0; i++) {
      const sl = comp.schedule[i];
      for (const id of [...(sl.matches || []), sl.match]) if (id && !shown.has(id)) { idx = i; mid = id; break; }
    }
    if (idx < 0) {
      if (comp.status === 'done') { if (!shown.has(-1)) { shown.add(-1); await segChampions(); } return; }
      waitingPanel(comp.status === 'running' ? L.preparing : L.soon);
      return;
    }
    shown.add(mid);
    const slot = comp.schedule[idx];
    // Els costats i l'etapa, els del partit (a la sèrie es canvia de costat).
    let m0 = null;
    try { m0 = await fetchMatch(mid); } catch (e) {}
    const sl = { game: slot.game, phase: slot.phase, match: mid, a: m0 ? m0.owners[0] : slot.a, b: m0 ? m0.owners[1] : slot.b, stage: (m0 && m0.stage) || slot.stage };
    if (!explained.has(sl.game)) { explained.add(sl.game); await segExplain(sl.game); }
    await segPreview(sl);
    await segLive(sl);
    await segResult(sl);
    await pollOnce();
    await segStandings(sl);
  } finally { busy = false; }
}
async function singleShow() {
  let m;
  try { m = await fetchMatch(single, 0); } catch (e) { panel(`<h1 class="h1">${esc(String(e.message || e))}</h1>`); return; }
  m.owners.forEach((o, i) => { names[o] = (m.names || [])[i] || o; titles[o] = (m.titles || [])[i] || ''; });
  const kind = single.startsWith('demo-') ? L.demo : m.kind === 'practice' ? L.practice : (m.stage || '');
  $('comp').textContent = (GAME[m.game] || m.game) + ' · ' + kind;
  const sl = { game: m.game, match: single, a: m.owners[0], b: m.owners[1], stage: kind };
  for (;;) {
    await segExplain(sl.game);
    await segPreview(sl);
    await segLive(sl);
    await segResult(sl);
    await segSummary(sl);
    segLabel(L.end);
    const again = await new Promise(res => {
      const box = document.createElement('div'); box.className = 'again';
      box.innerHTML = `<button type="button">${esc(L.replay)}</button><button type="button" class="ghost">${esc(L.exportVideo)}</button><button type="button" class="ghost">${esc(L.close)}</button>`;
      $('panel').append(box);
      $('panel').style.pointerEvents = 'auto';
      const done = v => { box.remove(); $('panel').style.pointerEvents = ''; res(v); };
      box.children[0].onclick = () => done(true);
      box.children[1].onclick = async () => {
        const b = box.children[1]; b.disabled = true;
        try {
          const r = await exportVideo({ id: single, fetchMatch: after => fetchMatch(single, after),
            fetchVoice: key => fetch('/api/arena/voice?k=' + encodeURIComponent(key), { headers }).then(x => x.ok ? x.arrayBuffer() : null) });
          b.textContent = r ? '✓ ' + r.name : L.exportVideo;
        } catch (e) { b.textContent = '⚠ ' + (e.message || e); }
        b.disabled = false;
      };
      box.children[2].onclick = () => done(false);
    });
    if (!again) { parent.postMessage({ arenaTV: 'close' }, location.origin); return; }
  }
}

async function pollOnce() { try { const r = await get('/api/arena/stream'); comp = r.competition; script = r.script || null; } catch (e) {} }

if (single) {
  // Dins de l'Arena: un botó per tancar (o Esc).
  if (parent !== window) {
    const x = document.createElement('button'); x.className = 'close'; x.type = 'button'; x.textContent = '✕ ' + L.close;
    x.onclick = () => parent.postMessage({ arenaTV: 'close' }, location.origin); document.body.append(x);
    addEventListener('keydown', e => { if (e.key === 'Escape') parent.postMessage({ arenaTV: 'close' }, location.origin); });
    $('voice').style.marginRight = '90px';
  }
  singleShow();
} else setInterval(director, 1500);
