[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gregal-client"
version = "0.1.0"
description = "Python client for the shared Gregal chat and agent backend"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["httpx>=0.28,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["gregal_client*"]
